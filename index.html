<title>Clicker - Nivelul 1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:linear-gradient(180deg,#0d1118,#182130);color:#fff;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom))}
.game{width:min(92vw,430px);text-align:center}
h1{margin:0 0 8px;font-size:30px}.score{font-size:23px;font-weight:800;margin-bottom:12px}
.progress{height:15px;background:#2a3342;border-radius:999px;overflow:hidden;margin:0 auto 18px}.bar{height:100%;width:0;background:#ff8a00;transition:width .12s ease}
img{display:block;width:min(82vw,360px);max-height:62vh;object-fit:cover;margin:auto;border-radius:24px;box-shadow:0 18px 44px rgba(0,0,0,.5);-webkit-tap-highlight-color:transparent;transition:transform .08s ease}
img.pressed{transform:scale(.96)}.hint{margin-top:14px;font-size:14px;opacity:.72}
.plus{position:fixed;pointer-events:none;font-size:36px;font-weight:900;color:#ffd166;text-shadow:0 2px 8px #000;animation:float .65s ease-out forwards;z-index:10}
@keyframes float{0%{transform:translate(-50%,-20%) scale(.7);opacity:0}20%{opacity:1;transform:translate(-50%,-55%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-155%) scale(1)}}
.finish{position:fixed;inset:0;background:rgba(0,0,0,.84);display:none;place-items:center;padding:30px;z-index:20}.finish.show{display:grid}
.box{background:#1a2130;border-radius:24px;padding:28px;max-width:340px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
button{border:0;border-radius:14px;background:#ff8a00;color:#fff;font-weight:800;font-size:17px;padding:12px 18px}
</style>

let clicks=Number(localStorage.getItem('clicker-level1')||0);
const max=1000,score=document.getElementById('score'),bar=document.getElementById('bar'),photo=document.getElementById('photo'),finish=document.getElementById('finish');
function draw(){score.textContent=clicks;bar.style.width=Math.min(100,clicks/max*100)+'%';if(clicks>=max)finish.classList.add('show')}

 if(navigator.vibrate)navigator.vibrate(8);
});
