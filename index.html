<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<title>Clicker V3 — RAGE 5 secunde</title>
<style>
*{box-sizing:border-box}html{background:#fff}body{margin:0;min-height:100vh;min-height:100svh;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;color:#151515;background:#fff;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;transition:color .45s ease}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}button:focus-visible{outline:3px solid #f80;outline-offset:5px}
#rageBackdrop{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .45s ease;background:radial-gradient(ellipse at 50% 35%,#ff6740 0%,#e71919 38%,#870614 76%,#30030c 100%);z-index:0;overflow:hidden}#rageBackdrop:after{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(from 10deg at 50% 50%,transparent 0deg 20deg,rgba(255,150,70,.1) 20deg 24deg,transparent 24deg 40deg);animation:energy 18s linear infinite;animation-play-state:paused}.rage #rageBackdrop{opacity:1}.rage #rageBackdrop:after{animation-play-state:running}@keyframes energy{to{transform:rotate(360deg)}}
.game{position:relative;z-index:1;width:min(100%,420px);text-align:center}h1{margin:0 0 8px;font-size:30px}.score{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;margin:0 0 12px}.progress{height:15px;border-radius:999px;overflow:hidden;background:#e8e8e8;transition:background .45s}.bar{height:100%;width:0;background:#ff8a00;transition:width .12s linear}.status{height:40px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:14px;font-weight:800;color:#a22312}.timer{font-variant-numeric:tabular-nums;background:rgba(255,255,255,.22);border-radius:8px;padding:5px 8px}.timer[hidden]{display:none}
.card{padding:12px;border-radius:28px;background:#fff;box-shadow:0 12px 32px #0000001c;transition:background .45s,box-shadow .45s;transform-origin:center}.photo-button{position:relative;display:block;margin:auto;padding:0;width:100%;height:min(56vh,520px);height:min(56svh,520px);min-height:190px;border:0;border-radius:20px;overflow:hidden;background:#f3f3f3;transition:transform .09s ease,background .45s}.photo-button:active,.photo-button.pressed{transform:scale(.972)}.photo-button:disabled{cursor:wait}.photo-button img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none;transition:opacity .2s ease}#ragePhoto{opacity:0}.rage #normalPhoto{opacity:0}.rage #ragePhoto{opacity:1}
.rage{color:#fff}.rage .status{color:#fff}.rage .progress{background:#ffffff40}.rage .bar{background:linear-gradient(90deg,#ffe752,#ffae00)}.rage .card{background:#48000c55;box-shadow:0 0 0 2px #ffb19b,0 0 35px #ff3b3099,0 20px 42px #23000980;animation:power 1.4s ease-in-out infinite}.rage .photo-button{background:#500210}@keyframes power{0%,100%{box-shadow:0 0 0 2px #ffb19b,0 0 28px #ff3b3090,0 20px 42px #23000980}50%{box-shadow:0 0 0 3px #ffe48a,0 0 48px #ff3b30cc,0 20px 42px #23000980}}
.hint{font-size:14px;margin:14px 0 7px;opacity:.8}.version{font-size:11px;opacity:.5;margin:0}.plus{position:fixed;z-index:10;pointer-events:none;color:#ec7100;font-size:36px;font-weight:900;text-shadow:0 2px 8px #0002;animation:floatUp .65s ease-out forwards}.plus.boost{color:#ffe85b;text-shadow:0 2px 8px #500000}@keyframes floatUp{0%{opacity:1;transform:translate(-50%,-50%) scale(.8)}25%{opacity:1;transform:translate(-50%,-85%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.finish{position:fixed;inset:0;z-index:20;background:#000c;display:grid;place-items:center;padding:24px}.finish[hidden]{display:none}.box{background:#fff;color:#151515;text-align:center;border-radius:24px;padding:28px;max-width:350px;box-shadow:0 20px 50px #0007}.box h2{margin-top:0}.action{border:0;border-radius:12px;background:#ef7800;color:#fff;padding:12px 20px;font-weight:800}.error{font-size:13px;color:#ae1d12;margin:8px 0}.rage .error{color:#fff}.error[hidden],#reload[hidden]{display:none}
@media(max-height:600px){body{align-items:flex-start}.photo-button{height:52svh;min-height:150px}h1{font-size:25px}.status{height:34px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.plus{opacity:1}}
</style>
</head>
<body>
<div id="rageBackdrop" aria-hidden="true"></div>
<main class="game">
<h1>Nivelul 1</h1>
<p class="score">Clickuri: <span id="score">0</span> / 1000</p>
<div class="progress" role="progressbar" aria-label="Progres nivel" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="0"><div id="bar" class="bar"></div></div>
<div class="status"><span id="statusText">Se încarcă pozele…</span><span id="timer" class="timer" hidden>5s</span></div>
<div class="card"><button id="tap" class="photo-button" disabled aria-label="Apasă pe poză pentru clickuri"><img id="normalPhoto" src="normal-v3.webp" width="320" height="464" alt="Poza normală — Nivelul 1" draggable="false" fetchpriority="high"><img id="ragePhoto" src="rage-v3.webp" width="320" height="671" alt="Poza cu bluza albastră — RAGE" draggable="false" loading="eager"></button></div>
<p id="imageError" class="error" hidden>Pozele nu s-au încărcat. Apasă „Reîncarcă”.</p><button id="reload" class="action" hidden>Reîncarcă</button>
<p class="hint">Apasă pe poză 👆</p><p class="version">V3 · RAGE 5 secunde · x2</p>
</main>
<div id="finish" class="finish" role="dialog" aria-modal="true" aria-labelledby="finishTitle" hidden><div class="box"><h2 id="finishTitle">🎉 1000 de clickuri!</h2><p>Ai terminat Nivelul 1.</p><button id="again" class="action">Joacă din nou</button></div></div>
<script>
(function(){
'use strict';
const MAX=1000, STEP=100, RAGE_MS=5000, KEY='clicker-v3-state';
const byId=id=>document.getElementById(id);
const tap=byId('tap'),normal=byId('normalPhoto'),rage=byId('ragePhoto');
const scoreEl=byId('score'),bar=byId('bar'),statusText=byId('statusText'),timer=byId('timer'),finish=byId('finish');
function read(key){try{return localStorage.getItem(key);}catch(_){return null;}}
function write(key,value){try{localStorage.setItem(key,value);}catch(_){}}
function integer(value,fallback,min,max){const n=Number(value);return Number.isFinite(n)?Math.max(min,Math.min(max,Math.floor(n))):fallback;}
let saved=null;try{saved=JSON.parse(read(KEY)||'null');}catch(_){}
let score=integer(saved?saved.score:read('clicker-level1'),0,0,MAX);
let next=saved?integer(saved.next,100,100,1000):(Math.floor(score/STEP)+1)*STEP;
next=Math.max(STEP,Math.min(MAX,Math.ceil(next/STEP)*STEP));
let pending=saved?integer(saved.pending,0,0,9):0;
let until=saved?integer(saved.until,0,0,Date.now()+RAGE_MS):0;
if(until<=Date.now()||score>=MAX)until=0;
if(score>=MAX)pending=0;
let ready=false,pressTimer=0;
function active(){return until>Date.now();}
function save(){write(KEY,JSON.stringify({score,next,pending,until}));write('clicker-level1',String(score));}
function draw(){
 const boosted=active();document.body.classList.toggle('rage',boosted);
 scoreEl.textContent=score;bar.style.width=(score/MAX*100)+'%';bar.parentElement.setAttribute('aria-valuenow',String(score));
 timer.hidden=!boosted;if(boosted)timer.textContent=Math.ceil((until-Date.now())/1000)+'s';
 if(score>=MAX)statusText.textContent='Nivel complet!';
 else if(!ready)statusText.textContent='Se încarcă pozele…';
 else if(boosted)statusText.textContent='🔥 MOD NERVOS · x2';
 else if(pending>0)statusText.textContent='🔥 Următorul RAGE la următoarea apăsare';
 else statusText.textContent='Următorul RAGE la '+next+' clickuri';
 finish.hidden=score<MAX;tap.disabled=!ready||score>=MAX;
}
function expire(){if(until&&Date.now()>=until){until=0;save();}draw();}
function start(){if(active()||pending<1||score>=MAX)return;pending--;until=Date.now()+RAGE_MS;}
function pop(amount,e){const rect=tap.getBoundingClientRect();const p=document.createElement('span');p.className='plus'+(amount===2?' boost':'');p.textContent='+'+amount;p.style.left=(e.clientX||rect.left+rect.width/2)+'px';p.style.top=(e.clientY||rect.top+rect.height/2)+'px';p.setAttribute('aria-hidden','true');document.body.appendChild(p);setTimeout(()=>p.remove(),700);}
tap.addEventListener('click',function(e){
 if(!ready||score>=MAX)return;
 expire();const amount=Math.min(active()?2:1,MAX-score);score+=amount;
 // Queue every crossed hundred, including thresholds reached during RAGE.
 while(next<MAX&&score>=next){pending++;next+=STEP;}
 if(score>=MAX){until=0;pending=0;}else if(!active()){start();}
 save();draw();pop(amount,e);
 clearTimeout(pressTimer);tap.classList.add('pressed');pressTimer=setTimeout(()=>tap.classList.remove('pressed'),80);
});
byId('again').addEventListener('click',function(){score=0;next=STEP;pending=0;until=0;save();draw();tap.focus({preventScroll:true});});
byId('reload').addEventListener('click',()=>location.reload());
function checkImages(){ready=[normal,rage].every(img=>img.complete&&img.naturalWidth>0);if(ready){byId('imageError').hidden=true;byId('reload').hidden=true;}draw();}
function imageError(){ready=false;byId('imageError').hidden=false;byId('reload').hidden=false;draw();}
[normal,rage].forEach(img=>{img.addEventListener('load',checkImages);img.addEventListener('error',imageError);});
checkImages();save();setInterval(expire,50);
document.addEventListener('visibilitychange',expire);window.addEventListener('pagehide',save);
})();
</script>
</body>
</html>
