<title>Clicker - Nivelul 1</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:calc(18px + env(safe-area-inset-top)) 18px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(180deg,#fff,#f4f4f4);color:#111;transition:background .75s ease,color .35s ease}
body.rage{background:radial-gradient(circle at 50% 30%,#ff6767 0%,#ff2020 35%,#a60000 70%,#3e0000 100%);animation:rageBg .55s infinite alternate}
@keyframes rageBg{from{filter:saturate(1) brightness(1)}to{filter:saturate(1.25) brightness(1.08)}}
.game{width:min(92vw,430px);text-align:center}
h1{margin:0 0 8px;font-size:30px}
.score{font-size:23px;font-weight:800;margin-bottom:10px}
.progress{height:16px;background:#ddd;border-radius:999px;overflow:hidden;margin:0 auto 14px}
.bar{height:100%;width:0;background:#ff8a00;transition:width .12s ease}
.status{min-height:29px;font-weight:900;color:#b60000;margin-bottom:8px}
body.rage h1,body.rage .score,body.rage .hint,body.rage .status{color:#fff}
body.rage .progress{background:rgba(255,255,255,.2)}
body.rage .bar{background:linear-gradient(90deg,#ffd400,#ff6a00,#ff0000)}
.card{padding:14px;border-radius:28px;background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.14);transition:.35s ease}
body.rage .card{background:rgba(80,0,0,.24);box-shadow:0 0 0 2px rgba(255,255,255,.2),0 0 28px rgba(255,0,0,.7),0 18px 40px rgba(0,0,0,.4)}
img{display:block;width:min(82vw,360px);max-height:58vh;object-fit:cover;margin:auto;border-radius:24px;box-shadow:0 18px 44px rgba(0,0,0,.22);-webkit-tap-highlight-color:transparent;transition:transform .08s ease,filter .25s ease,box-shadow .25s ease}
img.pressed{transform:scale(.965)}
body.rage img{animation:shake .11s infinite alternate;filter:saturate(1.3) contrast(1.08);box-shadow:0 0 0 3px rgba(255,255,255,.25),0 0 28px rgba(255,0,0,.7),0 20px 45px rgba(0,0,0,.45)}
@keyframes shake{from{transform:translateX(-2px) rotate(-.8deg)}to{transform:translateX(2px) rotate(.8deg)}}
.hint{margin-top:14px;font-size:14px;opacity:.8}
.plus{position:fixed;pointer-events:none;font-size:36px;font-weight:900;color:#ff8a00;text-shadow:0 2px 8px rgba(0,0,0,.18);animation:float .65s ease-out forwards;z-index:10}
body.rage .plus{color:#ffeb3b;text-shadow:0 2px 10px rgba(0,0,0,.65)}
@keyframes float{0%{transform:translate(-50%,-20%) scale(.7);opacity:0}20%{opacity:1;transform:translate(-50%,-55%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-155%) scale(1)}}
.timer{display:inline-block;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.2);margin-left:6px}
.finish{position:fixed;inset:0;background:rgba(0,0,0,.84);display:none;place-items:center;padding:30px;z-index:20}
.finish.show{display:grid}
.box{background:#1a2130;color:#fff;border-radius:24px;padding:28px;max-width:340px;box-shadow:0 20px 50px rgba(0,0,0,.5)}
button{border:0;border-radius:14px;background:#ff8a00;color:#fff;font-weight:800;font-size:17px;padding:12px 18px}
</style>
</head>

const max = 1000;

const score = document.getElementById('score');
const bar = document.getElementById('bar');
const photo = document.getElementById('photo');
const finish = document.getElementById('finish');
const status = document.getElementById('status');

function draw() {
  score.textContent = clicks;
  bar.style.width = Math.min(100, clicks / max * 100) + '%';
  if (clicks >= max) finish.classList.add('show');
}

function nextMilestone() {
  return lastRageAt + 100;
}

function statusDraw() {
  if (rageActive) {
    status.innerHTML = '🔥 MOD NERVOS x2 <span class="timer">' + secs + 's</span>';
  } else {
    status.textContent = 'Următorul MOD NERVOS la ' + nextMilestone() + ' clickuri';
  }
}

function stopRage() {
  rageActive = false;
  clearInterval(rageTimer);
  document.body.classList.remove('rage');
  photo.src = normalImg;
  statusDraw();
}

function startRage(milestone) {
  if (rageActive) return;
  lastRageAt = milestone;
  localStorage.setItem('clicker-level1-last-rage', String(lastRageAt));
  rageActive = true;
  secs = 10;
  document.body.classList.add('rage');
  photo.src = rageImg;
  statusDraw();

  rageTimer = setInterval(() => {
    secs--;
    statusDraw();
    if (secs <= 0) stopRage();
  }, 1000);
}

draw();
statusDraw();

photo.addEventListener('click', (e) => {
  if (clicks >= max) return;

  const amount = rageActive ? 2 : 1;
  clicks += amount;
  localStorage.setItem('clicker-level1', String(clicks));
  draw();

  if (!rageActive && clicks >= nextMilestone() && nextMilestone() <= max) {
    startRage(nextMilestone());
  }

  photo.classList.add('pressed');
  setTimeout(() => photo.classList.remove('pressed'), 80);

  const p = document.createElement('div');
  p.className = 'plus';
  p.textContent = '+' + (rageActive ? 2 : 1);
  p.style.left = e.clientX + 'px';
  p.style.top = e.clientY + 'px';
  document.body.appendChild(p);
  setTimeout(() => p.remove(), 650);

  if (navigator.vibrate) navigator.vibrate(rageActive ? 20 : 8);
});

document.getElementById('again').onclick = () => {
  clicks = 0;
  lastRageAt = 0;
  localStorage.setItem('clicker-level1', '0');
  localStorage.setItem('clicker-level1-last-rage', '0');
  localStorage.removeItem('clicker-level1-rage-used');
  stopRage();
  finish.classList.remove('show');
  draw();
  statusDraw();
};
</script>
