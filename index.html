<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="robots" content="noindex,nofollow">
<title>Clicker V5 — Nivelul 2: 1000–5000</title>
<style>
*{box-sizing:border-box}html{background:#fff}body{margin:0;min-height:100vh;min-height:100svh;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;color:#151515;background:#fff;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;transition:color .45s ease}button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}button:focus-visible{outline:3px solid #f80;outline-offset:5px}
#rageBackdrop{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .45s ease;background:radial-gradient(ellipse at 50% 35%,#ff6740 0%,#e71919 38%,#870614 76%,#30030c 100%);z-index:0;overflow:hidden}#rageBackdrop:after{content:"";position:absolute;inset:-40%;background:repeating-conic-gradient(from 10deg at 50% 50%,transparent 0deg 20deg,rgba(255,150,70,.1) 20deg 24deg,transparent 24deg 40deg);animation:energy 18s linear infinite;animation-play-state:paused}.rage #rageBackdrop{opacity:1}.rage #rageBackdrop:after{animation-play-state:running}@keyframes energy{to{transform:rotate(360deg)}}
.game{position:relative;z-index:1;width:min(100%,420px);text-align:center}h1{margin:0 0 6px;font-size:30px}.score{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;margin:0 0 6px}.power{margin:0 0 12px;font-size:13px;opacity:.8}.progress{height:15px;border-radius:999px;overflow:hidden;background:#e8e8e8;transition:background .45s}.bar{height:100%;width:0;background:#ff8a00;transition:width .12s linear}.status{height:40px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:14px;font-weight:800;color:#a22312}.timer{font-variant-numeric:tabular-nums;background:rgba(255,255,255,.22);border-radius:8px;padding:5px 8px}.timer[hidden]{display:none}
.card{padding:12px;border-radius:28px;background:#fff;box-shadow:0 12px 32px #0000001c;transition:background .45s,box-shadow .45s}.photo-button{position:relative;display:block;margin:auto;padding:0;width:100%;height:min(52vh,500px);height:min(52svh,500px);min-height:180px;border:0;border-radius:20px;overflow:hidden;background:#f3f3f3;transition:transform .09s ease,background .45s}.photo-button:active,.photo-button.pressed{transform:scale(.972)}.photo-button:disabled{cursor:wait}.photo-button img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;-webkit-user-drag:none;opacity:0;transition:opacity .2s ease}body[data-level="1"]:not(.rage) #normalPhoto,body[data-level="2"]:not(.rage) #level2Photo,.rage #ragePhoto{opacity:1}
.rage{color:#fff}.rage .status{color:#fff}.rage .progress{background:#ffffff40}.rage .bar{background:linear-gradient(90deg,#ffe752,#ffae00)}.rage .card{background:#48000c55;box-shadow:0 0 0 2px #ffb19b,0 0 35px #ff3b3099,0 20px 42px #23000980;animation:power 1.4s ease-in-out infinite}.rage .photo-button{background:#500210}@keyframes power{0%,100%{box-shadow:0 0 0 2px #ffb19b,0 0 28px #ff3b3090,0 20px 42px #23000980}50%{box-shadow:0 0 0 3px #ffe48a,0 0 48px #ff3b30cc,0 20px 42px #23000980}}
.hint{font-size:14px;margin:12px 0 6px;opacity:.8}.version{font-size:11px;opacity:.6;margin:0;line-height:1.6}.plus{position:fixed;z-index:10;pointer-events:none;color:#ec7100;font-size:36px;font-weight:900;text-shadow:0 2px 8px #0002;animation:floatUp .65s ease-out forwards}.plus.boost{color:#ffe85b;text-shadow:0 2px 8px #500000}@keyframes floatUp{0%{opacity:1;transform:translate(-50%,-50%) scale(.8)}25%{opacity:1;transform:translate(-50%,-85%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-190%) scale(1)}}
.finish{position:fixed;inset:0;z-index:20;background:#000c;display:grid;place-items:center;padding:24px}.finish[hidden]{display:none}.box{background:#fff;color:#151515;text-align:center;border-radius:24px;padding:28px;max-width:350px;box-shadow:0 20px 50px #0007}.box h2{margin-top:0}.action{border:0;border-radius:12px;background:#ef7800;color:#fff;padding:12px 20px;font-weight:800}.error{font-size:13px;color:#ae1d12;margin:8px 0}.rage .error{color:#fff}.error[hidden],#reload[hidden]{display:none}.toast{position:fixed;z-index:12;top:max(20px,env(safe-area-inset-top));left:50%;transform:translate(-50%,-15px);width:min(90%,370px);padding:14px 18px;border-radius:16px;background:#151515;color:#fff;text-align:center;font-weight:800;box-shadow:0 8px 28px #0003;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-height:600px){body{align-items:flex-start}.photo-button{height:48svh;min-height:140px}h1{font-size:25px}.status{height:34px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}.plus{opacity:1}}
</style>
</head>
<body data-level="1">
<div id="rageBackdrop" aria-hidden="true"></div>
<main class="game">
<h1 id="levelTitle">Nivelul 1</h1>
<p class="score">Clickuri: <span id="score">0</span> / <span id="target">1000</span></p>
<p id="powerText" class="power">Normal +1 · RAGE +2</p>
<div class="progress" role="progressbar" aria-label="Progres nivel" aria-valuemin="0" aria-valuemax="1000" aria-valuenow="0"><div id="bar" class="bar"></div></div>
<div class="status"><span id="statusText">Se încarcă pozele…</span><span id="timer" class="timer" hidden>5s</span></div>
<div class="card"><button id="tap" class="photo-button" disabled aria-label="Apasă pe poză pentru clickuri">
<img id="normalPhoto" src="normal-v3.webp" width="320" height="464" alt="Poza normală — Nivelul 1" draggable="false" fetchpriority="high">
<img id="level2Photo" src="level2-v4.webp" width="400" height="533" alt="Poza din mașină — Nivelul 2" draggable="false" loading="eager">
<img id="ragePhoto" src="rage-v3.webp" width="320" height="671" alt="Poza cu bluza albastră — RAGE" draggable="false" loading="eager">
</button></div>
<p id="imageError" class="error" hidden>Pozele nu s-au încărcat. Apasă „Reîncarcă”.</p><button id="reload" class="action" hidden>Reîncarcă</button>
<p class="hint">Apasă pe poză 👆</p><p id="totalText" class="version">Nivelul 1: 0 → 1000</p><p class="version">V5 · Nivelul 2: 1000–5000 · RAGE 5 secunde</p>
</main>
<div id="levelToast" class="toast" role="status" aria-live="polite"></div>
<div id="finish" class="finish" role="dialog" aria-modal="true" aria-labelledby="finishTitle" hidden><div class="box"><h2 id="finishTitle">🎉 Bravo!</h2><p>Ai ajuns la 5000 și ai terminat ambele niveluri!</p><button id="again" class="action">Joacă din nou de la Nivelul 1</button></div></div>
<script src="game-v5.js" defer></script>
</body>
</html>
